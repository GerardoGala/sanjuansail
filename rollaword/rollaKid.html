<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RollaWord - Digital Scrabble Game</title>
  <link rel="stylesheet" href="css/rollaword.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 1) Top Count-Down Timer -->
  <header>
    <h1>ROLLAKID</h1>
    <h2>🧒 FUN PLAY</h2>
 
  </header>

 
<!-- 2) Playing board: 6 rows x 8 columns -->
<div id="game-board"></div>

<!-- White separation between board and dice tray -->
<div id="board-separator"></div>

<!-- Dice tray: 1 row x 8 columns -->
<div id="dice-tray"></div>

  <!-- 3) Instant Scoring Submission Button with Position Overlay -->
  <!-- FIXED: Added margin: 10px auto; to center-align the action panel container -->
  <div id="action-panel" style="position: relative; width: 100%; max-width: calc(var(--cell-size) * 8 + 2px); height: 45px; margin: 10px auto;">
    
    <!-- 🏁 Done Button (Resting at the bottom layer) -->
    <button id="done-btn" class="btn" disabled 
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;"
            onclick="this.disabled=true; document.getElementById('start-btn').style.display='block'; if(typeof clearTimeoutEngine === 'function') clearTimeoutEngine();">
      Done
    </button>

    <!-- 🚀 Start Button (Mask layer: perfectly mirrors and hides Done) -->
    <button id="start-btn" class="btn" 
            style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 10;" 
            onclick="this.style.display='none'; document.getElementById('done-btn').disabled=false; if(typeof startGameEngine === 'function') startGameEngine();">
      START
    </button>

  </div>


  <!-- 4) Bottom Plain Text Formula Scoring Output Box -->
  <div id="score-output-area">
    <div>Press Start to Play!</div>
  </div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const doneBtn = document.getElementById('done-btn');
    
    if (doneBtn) {
        doneBtn.addEventListener('click', () => {
            // Trigger the celebration UI
            KidsCelebration.trigger();
        });
    }
});
</script>


<script src="js/rollawordbonus.js"></script>
<script src="js/rollawordisland.js"></script>
<script src="js/rollaworddisplay.js"></script>
<script src="js/rollawordscoring.js"></script>
<script src="js/rollaworddictionary.js"></script>
<script src="js/rollawordkid.js"></script> <!-- Swapped in -->
<script src="js/rollawordkidcelebration.js"></script>  
<script src="js/rollaword.js"></script>
</body>
</html>
