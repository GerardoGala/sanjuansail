<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ILCA Regatta Dashboard</title>
    <!-- Fonts & Layout Stylesheets -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Roboto+Flex:opsz,wdth,wght@8..144,25..151,100..1000&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="results.css">
</head>
<body>

    <div class="control-panel" style="display: flex; gap: 10px; align-items: center;">
        <!-- Upload Trigger -->
        <label for="csv-file-input" class="upload-btn">Upload Fleet Results (.CSV)</label>
        <input type="file" id="csv-file-input" accept=".csv">
        
        <!-- NEW: Download Export Button (Starts disabled, zero-radius) -->
        <button id="download-scored-btn" disabled style="background-color: #cccccc; color: #666666; border: 1px solid #cccccc; padding: 6px 12px; cursor: not-allowed; font-weight: 600; text-transform: uppercase;">
            Download Scored Results
        </button>
    </div>

    <!-- Layout Data Matrix Containers -->
    <div class="responsive-table-box" id="targetArea"></div>
    <div class="pagination-container" id="paginationControls"></div>

    <!-- Call your sequential script layers safely -->
    <script src="parser.js"></script>
    <script src="results.js"></script>
</body>
</html>
