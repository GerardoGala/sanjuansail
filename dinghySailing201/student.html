<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>
  	<!-- 1. External Framework First (Loaded from fast global CDN servers) -->
  	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

  	<!-- 2. Your Personal Custom CSS Last (Overrides everything above safely) -->
  	<link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="manifest" href="favicon/site.webmanifest">
</head>
<body>
 <nav class="navbar navbar-expand-lg">
    <div class="container">
        <h2 class="navbar-brand fw-bold d-flex align-items-center" href="index.html">
        <i class="bi bi-mortarboard-fill me-2 fs-4"></i>
        San Juan Academy
        </h2>
    </div>
</nav>   
<main class="container py-5">
    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card shadow-sm">

                <div class="card-body p-4">

                    <h1 class="display-6 fw-bold">

                        Congratulations!

                    </h1>

                    <h2 class="text-primary mb-4">

                        Dinghy Sailing 101

                    </h2>

                    <p class="lead">

                        You have successfully passed the final examination.

                    </p>

                    <p>

                        Please enter your full name exactly as you would like
                        it to appear on your Certificate of Completion.

                    </p>

                    <div class="alert alert-info">

                        <i class="bi bi-info-circle-fill"></i>

                        Example:
                        <strong>Juan Dela Cruz</strong>

                    </div>

                    <div class="mb-4">

                        <label for="studentName"
                               class="form-label fw-semibold">

                            Full Name

                        </label>

                        <input
                            id="studentName"
                            type="text"
                            class="form-control form-control-lg"
                            placeholder="Enter your full name"
                            autocomplete="name"
                            autofocus>

                    </div>

                    <div class="d-grid">

                        <button
                            id="continueButton"
                            class="btn btn-primary btn-lg"
                            disabled>

                            <i class="bi bi-award-fill"></i>

                            Continue to Certificate

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

</main>

<!-- Bootstrap -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

<!-- Student -->

<script src="js/student.js"></script>

</body>

</html>
