<div id="student-app-container">
<style>
    #student-app-container {
        font-family: Arial, sans-serif;
        color: #212529;
    }

    #student-login-container {
        max-width: 420px;
        margin: 30px auto;
        padding: 24px;
        border: 1px solid #dee2e6;
        border-radius: 8px;
        background: #ffffff;
    }

    #student-login-container h2 {
        margin-bottom: 20px;
        text-align: center;
        color: #006ABC;
    }

    #student-login-container label {
        display: block;
        margin: 12px 0 5px;
        font-weight: 600;
    }

    #student-login-container input {
        box-sizing: border-box;
        width: 100%;
        padding: 11px;
        border: 1px solid #ced4da;
        border-radius: 4px;
        font-size: 16px;
    }

    #student-login-container button {
        width: 100%;
        margin-top: 18px;
        padding: 12px;
        border: none;
        border-radius: 4px;
        background: #006ABC;
        color: #ffffff;
        font-size: 16px;
        cursor: pointer;
    }

    #student-login-container button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #student-login-container button:hover:not(:disabled) {
        background: #004f8c;
    }

    #student-login-message {
        margin-top: 14px;
        font-size: 14px;
        overflow-wrap: anywhere;
    }

    #student-login-message.error {
        color: #b02a37;
    }

    #student-login-message.success {
        color: #146c43;
    }

    #student-report-content {
        display: none;
    }

    #student-report-content h2 {
        margin-bottom: 16px;
    }

    #student-report-toolbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        flex-wrap: wrap;
    }

    #student-logout-button {
        padding: 8px 14px;
        border: none;
        border-radius: 4px;
        background: #006ABC;
        color: #ffffff;
        cursor: pointer;
    }

    #targetArea {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
    }

    #targetArea .report-table {
        width: 100%;
        min-width: 700px;
        border-collapse: collapse;
        text-align: left;
        background-color: #ffffff;
    }

    #targetArea th,
    #targetArea td {
        padding: 10px;
        border-right: 1px solid #e5e7eb;
        white-space: nowrap;
    }

    #targetArea th {
        border-bottom: 2px solid #e5e7eb;
        font-weight: 600;
        cursor: pointer;
    }

    #targetArea th:last-child,
    #targetArea td:last-child {
        border-right: none;
    }

    #targetArea thead tr {
        background-color: #f9fafb;
    }

    #targetArea tbody tr {
        border-bottom: 1px solid #e5e7eb;
    }

    #student-loading-message {
        margin: 20px 0;
        text-align: center;
    }

    @media (max-width: 480px) {
        #student-login-container {
            margin: 20px auto;
            padding: 18px;
        }
    }
</style>

<!-- Loading message shown while Firebase checks login status -->
<div id="student-loading-message">
    Checking login status...
</div>

<!-- Login form: shown only when the viewer is logged out -->
<div id="student-login-container" style="display:none;">

    <h2>Student Report Login</h2>

    <form id="student-login-form">

        <label for="student-email">Email</label>
        <input
            type="email"
            id="student-email"
            autocomplete="username"
            required>

        <label for="student-password">Password</label>
        <input
            type="password"
            id="student-password"
            autocomplete="current-password"
            required>

        <button type="submit" id="student-login-button">
            Log In
        </button>

    </form>

    <button type="button" id="student-reset-button">
        Forgot Password?
    </button>

    <div id="student-login-message" role="status" aria-live="polite"></div>

</div>

<!-- Student report: shown only when Firebase confirms login -->
<div id="student-report-content">

    <div id="student-report-toolbar">
        <h2>Student Report</h2>

        <button type="button" id="student-logout-button">
            Log Out
        </button>
    </div>

    <div id="targetArea" class="responsive-scroll-box"></div>

</div>

<script type="module">
    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
        getAuth,
        onAuthStateChanged,
        signInWithEmailAndPassword,
        sendPasswordResetEmail,
        signOut
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

    // IMPORTANT:
    // Copy the actual configuration from your working login.html.
    const firebaseConfig = {

        apiKey: "AIzaSyCsVFxlWhfnogijECMRgsUBFDGPyi4LjVo",

        authDomain: "san-juan-academy.firebaseapp.com",

        projectId: "san-juan-academy",

        appId: "1:579054522531:web:1b03832b8c43042e79af16"

    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loadingMessage =
        document.getElementById("student-loading-message");

    const loginContainer =
        document.getElementById("student-login-container");

    const reportContent =
        document.getElementById("student-report-content");

    const loginForm =
        document.getElementById("student-login-form");

    const loginButton =
        document.getElementById("student-login-button");

    const resetButton =
        document.getElementById("student-reset-button");

    const logoutButton =
        document.getElementById("student-logout-button");

    const message =
        document.getElementById("student-login-message");

    const emailInput =
        document.getElementById("student-email");

    const passwordInput =
        document.getElementById("student-password");

    let masterRows = [];
    let ascending = Array(7).fill(true);
    let reportLoaded = false;

    const keys = [
        "ID",
        "Name",
        "Department",
        "Major",
        "Enrollment Date",
        "GPA",
        "Status"
    ];

    // Display the appropriate interface.
    function showLogin() {
        loadingMessage.style.display = "none";
        reportContent.style.display = "none";
        loginContainer.style.display = "block";
    }

    function showReport() {
        loadingMessage.style.display = "none";
        loginContainer.style.display = "none";
        reportContent.style.display = "block";

        if (!reportLoaded) {
            loadStudentData();
        }
    }

    function showMessage(text, type = "") {
        message.textContent = text;
        message.className = type;
    }

    // Handle login.
    loginForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        loginButton.disabled = true;
        loginButton.textContent = "Logging In...";
        showMessage("");

        try {
            await signInWithEmailAndPassword(
                auth,
                email,
                password
            );

            // Firebase's authentication listener will display the report.

        } catch (error) {
            showMessage(
                "Login failed. Please check your email and password.",
                "error"
            );
        } finally {
            loginButton.disabled = false;
            loginButton.textContent = "Log In";
            passwordInput.value = "";
        }
    });

    // Handle password reset.
    resetButton.addEventListener("click", async () => {
        const email = emailInput.value.trim();

        if (!email) {
            showMessage(
                "Please enter your email address first.",
                "error"
            );
            emailInput.focus();
            return;
        }

        resetButton.disabled = true;
        showMessage("Sending password reset email...");

        try {
            await sendPasswordResetEmail(auth, email);

            showMessage(
                "If an account exists for that email, a password reset email will be sent.",
                "success"
            );
        } catch (error) {
            // Use a generic message rather than exposing account details.
            showMessage(
                "Unable to send the reset email. Check the address and try again.",
                "error"
            );
        } finally {
            resetButton.disabled = false;
        }
    });

    // Handle logout.
    logoutButton.addEventListener("click", async () => {
        logoutButton.disabled = true;

        try {
            await signOut(auth);
        } catch (error) {
            console.error("Logout failed:", error);
            alert("Unable to log out. Please try again.");
        } finally {
            logoutButton.disabled = false;
        }
    });

    // Firebase determines whether to show the report or login form.
    onAuthStateChanged(auth, (user) => {
        if (user) {
            showReport();
        } else {
            showLogin();
        }
    });

    // Fetch the fictional student data.
    function loadStudentData() {
        fetch("students.json")
            .then((response) => {
                if (!response.ok) {
                    throw new Error("Failed to load students.json");
                }

                return response.json();
            })
            .then((data) => {
                masterRows = data;
                reportLoaded = true;
                setupTableFramework();
            })
            .catch((error) => {
                console.error(error);

                const target = document.getElementById("targetArea");

                target.textContent =
                    "Unable to load student data. Please refresh the page.";
            });
    }

    // Generate the report table.
    function setupTableFramework() {
        const target = document.getElementById("targetArea");

        if (!target) return;

        let headerCells = "";

        for (let i = 0; i < keys.length; i++) {
            headerCells +=
                '<th data-index="' + i + '">' +
                keys[i] + ' ↕</th>';
        }

        target.innerHTML = `
            <table class="report-table">
                <thead>
                    <tr>${headerCells}</tr>
                </thead>
                <tbody id="table-rows-body"></tbody>
            </table>`;

        target.querySelector("thead").addEventListener("click", (event) => {
            const th = event.target.closest("th");

            if (th) {
                const index = Number(th.getAttribute("data-index"));
                sortColumn(index);
            }
        });

        renderTableRows();
    }

    // Render the table rows.
    function renderTableRows() {
        const tbody = document.getElementById("table-rows-body");

        if (!tbody) return;

        tbody.innerHTML = masterRows.map((row) => `
            <tr>
                <td>${row.ID ?? ""}</td>
                <td><strong>${row.Name ?? ""}</strong></td>
                <td>${row.Department ?? ""}</td>
                <td>${row.Major ?? ""}</td>
                <td>${row["Enrollment Date"] ?? ""}</td>
                <td>${row.GPA !== undefined
                    ? Number(row.GPA).toFixed(2)
                    : ""}</td>
                <td>${row.Status ?? ""}</td>
            </tr>
        `).join("");
    }

    // Sort the table by the selected column.
    function sortColumn(index) {
        const key = keys[index];
        const isAsc = ascending[index];

        masterRows.sort((a, b) => {
            const valA = a[key] ?? "";
            const valB = b[key] ?? "";

            if (key === "GPA") {
                return isAsc
                    ? Number(valA) - Number(valB)
                    : Number(valB) - Number(valA);
            }

            return isAsc
                ? String(valA).localeCompare(
                    String(valB),
                    undefined,
                    { numeric: true }
                )
                : String(valB).localeCompare(
                    String(valA),
                    undefined,
                    { numeric: true }
                );
        });

        ascending[index] = !isAsc;
        renderTableRows();
    }
</script>
</div>
