        let masterRows = [];
        let ascending = Array(7).fill(true);
        const keys = ["ID", "Name", "Department", "Major", "Enrollment Date", "GPA", "Status"];

        // Fetch data and build UI
        function loadStudentData() {
            fetch("students.json")
                .then(res => res.ok ? res.json() : Promise.reject())
                .then(data => {
                    masterRows = data;
                    setupTableFramework();
                })
                .catch(() => console.error("Failed to load students.json"));
        }

        // Generate UI shell
        function setupTableFramework() {
            const target = document.getElementById('targetArea');
            if (!target) return;

            let headerCells = "";
            for (let i = 0; i < keys.length; i++) {
                headerCells += '<th data-index="' + i + '" style="cursor:pointer; border-bottom: 2px solid #e5e7eb; border-right: 1px solid #e5e7eb; font-weight: 600;">' + keys[i] + ' ↕</th>';
            }

            target.innerHTML = `
                <table class="report-table" style="width:100%; border-collapse: collapse; text-align: left; background-color: #ffffff;">
                    <thead>
                        <tr style="background-color: #f9fafb;">
                            ${headerCells}
                        </tr>
                    </thead>
                    <tbody id="table-rows-body"></tbody>
                </table>`;

            // Event delegation for table header clicks
            target.querySelector('thead').addEventListener('click', (e) => {
                const th = e.target.closest('th');
                if (th) {
                    const index = parseInt(th.getAttribute('data-index'), 10);
                    sortColumn(index);
                }
            });

            renderTableRows();
        }

        // Render updates only
        function renderTableRows() {
            const tbody = document.getElementById('table-rows-body');
            if (!tbody) return;

            tbody.innerHTML = masterRows.map(row => `
                <tr style="border-bottom: 1px solid #e5e7eb;">
                    <td style="border-right: 1px solid #e5e7eb;">${row.ID ?? ''}</td>
                    <td style="border-right: 1px solid #e5e7eb;"><strong>${row.Name ?? ''}</strong></td>
                    <td style="border-right: 1px solid #e5e7eb;">${row.Department ?? ''}</td>
                    <td style="border-right: 1px solid #e5e7eb;">${row.Major ?? ''}</td>
                    <td style="border-right: 1px solid #e5e7eb;">${row["Enrollment Date"] ?? ''}</td>
                    <td style="border-right: 1px solid #e5e7eb;">${row.GPA !== undefined ? Number(row.GPA).toFixed(2) : ''}</td>
                    <td>${row.Status ?? ''}</td>
                </tr>
            `).join('');
        }

        // Sort core array logic
        function sortColumn(index) {
            const key = keys[index];
            const isAsc = ascending[index];

            masterRows.sort((a, b) => {
                const valA = a[key] ?? '';
                const valB = b[key] ?? '';

                if (key === "GPA") return isAsc ? Number(valA) - Number(valB) : Number(valB) - Number(valA);
                return isAsc 
                    ? String(valA).localeCompare(String(valB), undefined, {numeric: true}) 
                    : String(valB).localeCompare(String(valA), undefined, {numeric: true});
            });

            ascending[index] = !isAsc;
            renderTableRows();
        }

        // Initialize execution safely on window layout load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadStudentData);
        } else {
            loadStudentData();
        }
    })();</script></div></div></article><div class="banner banner--after-content"><div class="wrapper"><div class="google-review-cta" style="margin: 8px 0; padding: 10px; border: 1px solid #006ABC; border-radius: 0px; background-color: #ffffff; text-align: center;"><h5 style="margin-top: 0; color: #006ABC; font-size: .8rem; font-family: inherit;">Found this guide helpful?</h5><a href="https://g.page/r/CWkxEjqcMdcaEAE/review" target="_blank" rel="noopener noreferrer" class="google-review-btn">Write a Google Review <span class="review-stars">★★★★★</span></a><style>.google-review-btn {
