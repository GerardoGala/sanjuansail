<!-- Load standard open-source Apache ECharts dependency via high-availability CDN -->
<p>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
    const canvasNode = document.getElementById('scrolly-logic-canvas');
    const yearDisplay = document.getElementById('meta-year-badge');
    const epochDisplay = document.getElementById('meta-epoch-title');
    const narrativeDisplay = document.getElementById('meta-narrative-box');
    const filterButtons = document.querySelectorAll('.macro-filter-btn');
    
    let chartCoreInstance = echarts.init(canvasNode);
    let activeYearGlobal = "2000";
    let activeMetricGlobal = "housing"; // Tracks current cross-tab toggle segment

    // Complete micro-segmented structural data matrices
    const structuredMatrix = {
        "2000": {
            epoch: "The Trade Bill Handshake",
            narrative: "US manufacturing baseline remains intact. Discretionary breathing room is wide and distributed equitably across cohorts.",
            housing: { cohorts: ['Renters', 'Homeowners'], values: [55, 78] },
            race: { cohorts: ['Black Households', 'White Households'], values: [48, 69] },
            marriage: { cohorts: ['Divorced', 'Married Pairs'], values: [51, 82] },
            children: { cohorts: ['Child Count > 2', 'Infants < 3 Years'], values: [58, 64] }
        },
        "2008": {
            epoch: "The Great Decoupling Acceleration",
            narrative: "Offshoring factory centers triggers domestic stagnation. The divergence opens as shelter overhead swallows margins.",
            housing: { cohorts: ['Renters', 'Homeowners'], values: [42, 71] },
            race: { cohorts: ['Black Households', 'White Households'], values: [36, 62] },
            marriage: { cohorts: ['Divorced', 'Married Pairs'], values: [40, 75] },
            children: { cohorts: ['Child Count > 2', 'Infants < 3 Years'], values: [46, 53] }
        },
        "2018": {
            epoch: "The Peak Consumer Shift",
            narrative: "Supply networks consolidate in global hubs. Unprotected demographic assets hit acute affordability ceilings.",
            housing: { cohorts: ['Renters', 'Homeowners'], values: [31, 65] },
            race: { cohorts: ['Black Households', 'White Households'], values: [25, 54] },
            marriage: { cohorts: ['Divorced', 'Married Pairs'], values: [29, 68] },
            children: { cohorts: ['Child Count > 2', 'Infants < 3 Years'], values: [33, 41] }
        },
        "2026": {
            epoch: "The Discretionary Breakdown",
            narrative: "Latest Census release patterns. Financial breathing room drops critically for renting and single-income archetypes.",
            housing: { cohorts: ['Renters', 'Homeowners'], values: [18, 58] },
            race: { cohorts: ['Black Households', 'White Households'], values: [12, 46] },
            marriage: { cohorts: ['Divorced', 'Married Pairs'], values: [15, 60] },
            children: { cohorts: ['Child Count > 2', 'Infants < 3 Years'], values: [21, 30] }
        }
    };

    // 1. Core Graphic Engine Translation Draw Function
    function syncDashboardView(year, selectedMetric) {
        if (!chartCoreInstance) return;
        
        const timeframeData = structuredMatrix[year];
        const dataProfile = timeframeData[selectedMetric];

        // Update textual metadata nodes instantly
        yearDisplay.innerText = year;
        epochDisplay.innerText = timeframeData.epoch;
        narrativeDisplay.innerText = timeframeData.narrative;

        const dynamicOptions = {
            grid: { top: '10%', left: '3%', right: '12%', bottom: '5%', containLabel: true },
            xAxis: {
                type: 'value',
                max: 100, // Fixed 0-100% capacity tracking boundary matrix
                axisLabel: { color: '#666', fontFamily: 'Roboto', fontSize: 10, formatter: '{value}%' },
                splitLine: { lineStyle: { color: '#f3f4f6', type: 'dashed' } }
            },
            yAxis: {
                type: 'category',
                data: dataProfile.cohorts,
                axisLabel: { color: '#111111', fontWeight: 700, fontFamily: 'Roboto', fontSize: 11 }
            },
            series: [{
                type: 'bar',
                data: [
                    { value: dataProfile.values[0], itemStyle: { color: '#dc2626' } }, // Disadvantaged Alert Crimson
                    { value: dataProfile.values[1], itemStyle: { color: '#4b5563' } }  // Advantaged Neutral Charcoal
                ],
                barMaxWidth: 22,
                label: { 
                    show: true, 
                    position: 'right', 
                    formatter: '{c}%', 
                    color: '#111', 
                    fontWeight: 700, 
                    fontFamily: 'Roboto',
                    fontSize: 12
                },
                animationDuration: 300,
                animationEasing: 'quadraticOut'
            }]
        };

        chartCoreInstance.setOption(dynamicOptions, true);
    }

    // Default initialization cycle parameter execution
    syncDashboardView(activeYearGlobal, activeMetricGlobal);

    // 2. INTERACTION EVENT: MANUAL MATRIX CROSS-TAB FILTERS (Tapping Switchboard Buttons)
    filterButtons.forEach(btn => {
        btn.addEventListener('click', function() {
            // Repaint control focus indicators
            filterButtons.forEach(b => {
                b.style.background = '#fff';
                b.style.color = '#444';
                b.style.borderColor = '#e4e4e7';
            });
            this.style.background = '#111';
            this.style.color = '#fff';
            this.style.borderColor = '#111';

            activeMetricGlobal = this.getAttribute('data-metric');
            syncDashboardView(activeYearGlobal, activeMetricGlobal);
        });
    });

    // 3. INTERACTION EVENT: SCROLL FOCUS DETECTOR (Intersection Observer Engine)
    const yardMarkers = document.querySelectorAll('.field-yard-marker');
    
    const trackingConfiguration = {
        root: null,
        rootMargin: '-30% 0px -45% 0px', // Narrows focus capture parameters to screen heartcenter
        threshold: 0.1
    };

    const intersectionObserverNode = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                activeYearGlobal = entry.target.getAttribute('data-year');
                syncDashboardView(activeYearGlobal, activeMetricGlobal);
            }
        });
    }, trackingConfiguration);

    yardMarkers.forEach(marker => intersectionObserverNode.observe(marker));

    // Handle responsive dimension calculations across viewport turns seamlessly
    window.addEventListener('resize', function() {
        if (chartCoreInstance) chartCoreInstance.resize();
    });
});
</script>
</p>
